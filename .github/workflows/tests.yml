# The kit's own tests, on every push to main and on every pull request, whatever
# its base, so a stacked pull request is checked where it stands.
#
# The project-name check runs first as its own step, so its result is visible
# on the run page. The full suite then runs it again with everything else. A
# skipped test fails the job: in CI a skipped test is not a pass.
#
# Python 3.12, the same as the first consumer's CI.
#
# The example's self-test (test_example) builds examples/minimal with mermaid-cli and checks the export in
# Chrome, so the job installs Node and runs `npm ci` in arch_kit/tools/export. Chrome is the runner's own. The
# render reads decision stamps from git, so the checkout takes full history. No Helm is installed: no test in the
# suite runs it (the example declares no data exchange, and the reader's unit tests use synthetic documents).
#
# Action pins: every third-party action is pinned to a full commit sha, with its version in a comment (from
# git ls-remote; the tags are lightweight, so the tag's own commit).
#
# The `action` job runs the kit's own Action from the checkout on examples/minimal, twice. The example declares
# hosting: none, so the first run must upload nothing. The second run uses a copy of the declaration with
# hosting: ci-artifact, and must upload the export. The two pass the commits the chart and the values are
# checked out at (the checkout's own sha); a third run with a malformed chart-ref must fail.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - run: pip install pyyaml markdown-it-py==4.0.0 jsonschema==4.26.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # Chrome is the runner's own, so puppeteer downloads none.
      - name: Install the export tooling
        working-directory: arch_kit/tools/export
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm ci

      - name: Project-name check
        run: python -m unittest discover -s arch_kit/tools -p 'test_declared_names.py' -v

      - name: Tests
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: |
          set +e
          python -m unittest discover -s arch_kit/tools -p 'test_*.py' > "$RUNNER_TEMP/tests.log" 2>&1
          rc=$?
          set -e
          tail -n 8 "$RUNNER_TEMP/tests.log"
          if [ "$rc" != 0 ]; then exit "$rc"; fi
          if grep -q 'skipped=' "$RUNNER_TEMP/tests.log"; then
            echo "tests: some were skipped; in CI a skipped test is not a pass"
            exit 1
          fi

  action:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run the Action, hosting none
        id: none
        uses: ./
        with:
          config: examples/minimal/arch-kit.yaml
          chart: examples/minimal/chart
          release: larkspur
          values: examples/minimal/values.yaml
          chart-ref: ${{ github.sha }}
          bundle-ref: ${{ github.sha }}
          readiness: examples/minimal/READINESS.md
          relabel: examples/minimal/relabel.txt
          barred: examples/minimal/barred.txt

      - name: No artifact when hosting is none
        env:
          HOSTING: ${{ steps.none.outputs.hosting }}
          ARTIFACT: ${{ steps.none.outputs.artifact-id }}
        run: |
          test "$HOSTING" = none
          if [ -n "$ARTIFACT" ]; then echo "an artifact was uploaded with hosting none"; exit 1; fi

      - name: Run the Action, hosting ci-artifact
        id: art
        uses: ./
        with:
          config: examples/minimal/arch-kit-ci-artifact.yaml
          chart: examples/minimal/chart
          release: larkspur
          values: examples/minimal/values.yaml
          chart-ref: ${{ github.sha }}
          bundle-ref: ${{ github.sha }}
          readiness: examples/minimal/READINESS.md
          relabel: examples/minimal/relabel.txt
          barred: examples/minimal/barred.txt
          out: ${{ runner.temp }}/arch-kit-export-2

      - name: The artifact is present when hosting is ci-artifact
        env:
          HOSTING: ${{ steps.art.outputs.hosting }}
          ARTIFACT: ${{ steps.art.outputs.artifact-id }}
        run: |
          test "$HOSTING" = ci-artifact
          if [ -z "$ARTIFACT" ]; then echo "no artifact was uploaded with hosting ci-artifact"; exit 1; fi

      # A chart-ref that is not 40 hex characters is refused before any tool runs.
      - name: Run the Action, malformed chart-ref
        id: bad
        continue-on-error: true
        uses: ./
        with:
          config: examples/minimal/arch-kit.yaml
          chart: examples/minimal/chart
          release: larkspur
          values: examples/minimal/values.yaml
          chart-ref: master
          bundle-ref: ${{ github.sha }}
          readiness: examples/minimal/READINESS.md
          relabel: examples/minimal/relabel.txt
          barred: examples/minimal/barred.txt
          out: ${{ runner.temp }}/arch-kit-export-bad

      - name: The malformed chart-ref failed the step
        env:
          OUTCOME: ${{ steps.bad.outcome }}
        run: |
          test "$OUTCOME" = failure

      # portal.mode: decisions skips check_views; the browser check runs its decisions-mode assertions in the
      # Chrome for Testing build the Action installs.
      - name: Run the Action, decisions-only portal
        uses: ./
        with:
          config: examples/decisions-only/arch-kit.yaml
          barred: examples/decisions-only/barred.txt
          out: ${{ runner.temp }}/arch-kit-export-3

      - name: The decisions-only run wrote its facts and browser log
        run: |
          out="$RUNNER_TEMP/arch-kit-export-3"
          for f in export.html facts.json browser.log; do
            test -s "$out/$f" || { echo "the decisions-only run left no $f"; exit 1; }
          done
          grep -q '"mode": "decisions"' "$out/facts.json"
          # The final line names the browser: the pinned build, not the runner's Chrome.
          grep -Eq '^[0-9]+ passed, 0 failed \(Chrome/155\.0\.8059\.79\)$' "$out/browser.log"
          test -s "$out/shots/front.png"
