name: arch-kit
description: Check and export a project's architecture records with arch-kit, and upload the export when the project declares it.
# The Action reads no secret. Public CI uses the sample lists by design; the relabel with a project's real names
# runs only locally. Every third-party action below is pinned to a full commit sha, version in the
# comment. The runner needs bash, Chrome on the PATH (the hosted Ubuntu image has it) and a checkout with full
# history (the render stamps decisions from git). It does not need Helm.

inputs:
  config:
    description: Path to the project's arch-kit.yaml.
    required: true
  chart:
    description: The chart directory, as render_html takes it. Required unless portal.mode is decisions.
    required: false
    default: ''
  release:
    description: The release name, as render_html takes it. Required unless portal.mode is decisions.
    required: false
    default: ''
  values:
    description: Values files, newline-separated, in order.
    required: false
    default: ''
  chart-ref:
    description: >-
      The 40-character commit the chart is checked out at. Required when chart is given. The Action does not check the
      chart out: the caller does, and the build refuses unless the chart is at this commit and has no changes.
    required: false
    default: ''
  bundle-ref:
    description: >-
      The 40-character commits the values files are checked out at, newline-separated, one per repository holding a
      values file. Required when chart is given. The build refuses unless the values are at these commits and have no
      changes.
    required: false
    default: ''
  readiness:
    description: The readiness document, as render_html takes it.
    required: false
    default: ''
  relabel:
    description: Relabel lists, newline-separated. Passed as repeated --relabel flags.
    required: false
    default: ''
  barred:
    description: Barred lists, newline-separated. Passed as repeated --barred flags.
    required: false
    default: ''
  out:
    description: The output directory.
    required: false
    default: ${{ runner.temp }}/arch-kit-export
  browser:
    description: Run the browser check (true or false).
    required: false
    default: 'true'
  index-check:
    description: Run check_decision_indexes (true or false).
    required: false
    default: 'true'

outputs:
  hosting:
    description: The declared portal.hosting.
    value: ${{ steps.portal.outputs.hosting }}
  audience:
    description: The declared portal.audience.
    value: ${{ steps.portal.outputs.audience }}
  artifact-id:
    description: The id of the uploaded artifact. Empty when nothing was uploaded.
    value: ${{ steps.upload.outputs.artifact-id }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'

    - name: Install arch-kit
      shell: bash
      run: |
        python -m pip install "$GITHUB_ACTION_PATH"

    # Node is needed by the render too: render_html draws diagrams with mermaid-cli, so this step does not
    # depend on `browser`.
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'

    - name: Install the export tooling
      shell: bash
      working-directory: ${{ github.action_path }}/arch_kit/tools/export
      env:
        PUPPETEER_SKIP_DOWNLOAD: 'true'
      run: |
        npm ci

    # The browser is the Chrome for Testing build puppeteer 25.14.0 names, so the diagrams and the browser check
    # do not move with the runner's own Chrome. A caller that sets PUPPETEER_EXECUTABLE_PATH keeps its own browser.
    - name: Install Chrome for Testing
      shell: bash
      run: |
        set -eu
        if [ -n "${PUPPETEER_EXECUTABLE_PATH:-}" ]; then
          echo "PUPPETEER_EXECUTABLE_PATH is set; keeping $PUPPETEER_EXECUTABLE_PATH"
          exit 0
        fi
        out="$(npx --yes @puppeteer/browsers@3.2.5 install chrome@155.0.8059.79 --path "$RUNNER_TEMP/chrome")"
        echo "$out"
        chrome="$(printf '%s\n' "$out" | tail -n 1 | awk '{print $NF}')"
        [ -f "$chrome" ] || { echo "the Chrome install printed no binary: $chrome"; exit 1; }
        echo "PUPPETEER_EXECUTABLE_PATH=$chrome" >> "$GITHUB_ENV"

    - name: Check and render
      id: chain
      shell: bash
      env:
        IN_CONFIG: ${{ inputs.config }}
        IN_CHART: ${{ inputs.chart }}
        IN_RELEASE: ${{ inputs.release }}
        IN_VALUES: ${{ inputs.values }}
        IN_CHART_REF: ${{ inputs.chart-ref }}
        IN_BUNDLE_REF: ${{ inputs.bundle-ref }}
        IN_READINESS: ${{ inputs.readiness }}
        IN_RELABEL: ${{ inputs.relabel }}
        IN_BARRED: ${{ inputs.barred }}
        IN_OUT: ${{ inputs.out }}
        IN_BROWSER: ${{ inputs.browser }}
        IN_INDEX_CHECK: ${{ inputs.index-check }}
        PYTHONIOENCODING: utf-8
        PYTHONUTF8: '1'
      run: |
        set -u
        # The commits are checked before any tool runs: 40 lowercase hex characters a line, nothing else.
        refs=()
        read_refs() {
          local input=$1 text=$2 l
          refs=()
          while IFS= read -r l; do
            [ -z "$l" ] && continue
            if ! [[ $l =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::arch-kit: the $input input must hold 40 lowercase hex characters on each line"
              exit 2
            fi
            refs+=("$l")
          done <<< "$text"
        }
        read_refs chart-ref "$IN_CHART_REF"; chart_refs=("${refs[@]}")
        read_refs bundle-ref "$IN_BUNDLE_REF"; bundle_refs=("${refs[@]}")
        if [ "${#chart_refs[@]}" -gt 1 ]; then
          echo "::error::arch-kit: the chart-ref input must hold one commit"
          exit 2
        fi
        if [ -n "$IN_CHART" ] && { [ "${#chart_refs[@]}" = 0 ] || [ "${#bundle_refs[@]}" = 0 ]; }; then
          echo "::error::arch-kit: chart-ref and bundle-ref are required with chart: pass the 40-character commits the chart and the values are checked out at"
          exit 2
        fi
        mkdir -p "$IN_OUT"
        values=(); relabel=(); barred=()
        while IFS= read -r l; do [ -n "$l" ] && values+=(--values "$l"); done <<< "$IN_VALUES"
        while IFS= read -r l; do [ -n "$l" ] && relabel+=(--relabel "$l"); done <<< "$IN_RELABEL"
        while IFS= read -r l; do [ -n "$l" ] && barred+=(--barred "$l"); done <<< "$IN_BARRED"
        chart=(); [ -n "$IN_CHART" ] && chart=(--chart "$IN_CHART")
        chart_commit=(); [ "${#chart_refs[@]}" = 1 ] && chart_commit=(--chart-commit "${chart_refs[0]}")
        bundle_commit=(); for r in "${bundle_refs[@]}"; do bundle_commit+=(--bundle-commit "$r"); done
        # The kit's commit. The kit runs installed, so render_html can't read it from git itself. It is HEAD of the
        # Action's own checkout (uses: ./), else the name of the directory a commit-pinned Action is unpacked into.
        kit_commit=()
        k="$(git -C "$GITHUB_ACTION_PATH" rev-parse HEAD 2>/dev/null || true)"
        [[ $k =~ ^[0-9a-f]{40}$ ]] || k="$(basename "$GITHUB_ACTION_PATH")"
        if [[ $k =~ ^[0-9a-f]{40}$ ]]; then
          kit_commit=(--kit-commit "$k")
        else
          echo "::warning::arch-kit: the kit's commit cannot be read; pin the Action to a 40-character commit"
        fi
        release=(); [ -n "$IN_RELEASE" ] && release=(--release "$IN_RELEASE")
        readiness=(); [ -n "$IN_READINESS" ] && readiness=(--readiness "$IN_READINESS")
        # mermaid-cli takes its browser from this file; the browser check takes the same path from the environment.
        chrome_json="$(printf '%s' "${PUPPETEER_EXECUTABLE_PATH:-}" | sed 's/\\/\\\\/g')"
        printf '{"executablePath": "%s", "args": ["--no-sandbox"]}\n' "$chrome_json" > "$IN_OUT/puppeteer.json"
        failed=0
        # step NAME COMMAND...: run, log to $IN_OUT/NAME.log, print the tail and the exit code.
        step() {
          local name=$1; shift
          "$@" > "$IN_OUT/$name.log" 2>&1
          local rc=$?
          echo "::group::$name (exit $rc)"
          tail -n 15 "$IN_OUT/$name.log"
          echo "::endgroup::"
          if [ "$rc" != 0 ]; then echo "$name exited $rc"; failed=1; fi
          return $rc
        }
        # The installed package has no node_modules: mermaid-cli is the one `npm ci` put in the Action's checkout.
        mmdc="$GITHUB_ACTION_PATH/arch_kit/tools/export/node_modules/.bin/mmdc"
        [ -f "$mmdc.cmd" ] && mmdc="$mmdc.cmd"   # Windows
        ak() { arch-kit --config "$IN_CONFIG" "$@"; }
        # portal.mode decisions: no views, record or diagrams, so no check_views. The browser check runs its own
        # decisions-mode assertions (browser_facts reads export.browser.search and min_pages, each with a default).
        mode="$(ak portal --mode)" || exit 2
        if [ "$mode" != decisions ]; then
          missing=""; noun="input is"
          [ -z "$IN_CHART" ] && missing="chart"
          [ -z "$IN_RELEASE" ] && { [ -n "$missing" ] && { missing="chart and release"; noun="inputs are"; } || missing="release"; }
          if [ -n "$missing" ]; then
            echo "::error::arch-kit: portal.mode is full: the $missing $noun required"
            exit 2
          fi
        fi
        if [ "$mode" != decisions ]; then
          step check_views ak check_views "${chart[@]}" "${release[@]}" "${values[@]}" "${readiness[@]}" "${barred[@]}"
        fi
        step render_html ak render_html --out "$IN_OUT/export.html" "${chart[@]}" "${release[@]}" \
          "${chart_commit[@]}" "${bundle_commit[@]}" "${kit_commit[@]}" "${values[@]}" "${readiness[@]}" "${relabel[@]}" "${barred[@]}" --mmdc "$mmdc" --puppeteer-config "$IN_OUT/puppeteer.json"
        step check_export ak check_export --export "$IN_OUT/export.html" "${relabel[@]}" "${barred[@]}"
        if [ "$IN_BROWSER" = true ]; then
          step browser_facts ak browser_facts --out "$IN_OUT/facts.json"
          step browser node "$GITHUB_ACTION_PATH/arch_kit/tools/export/check_export_browser.mjs" "$IN_OUT/export.html" \
            --shots "$IN_OUT/shots" --facts "$IN_OUT/facts.json" --puppeteer-config "$IN_OUT/puppeteer.json"
        fi
        if [ "$IN_INDEX_CHECK" = true ]; then
          step check_decision_indexes ak check_decision_indexes
        fi
        exit "$failed"

    - name: Read the portal declaration
      id: portal
      shell: bash
      env:
        IN_CONFIG: ${{ inputs.config }}
        PYTHONUTF8: '1'
      run: |
        read -r hosting audience < <(arch-kit --config "$IN_CONFIG" portal)
        echo "hosting=$hosting" >> "$GITHUB_OUTPUT"
        echo "audience=$audience" >> "$GITHUB_OUTPUT"
        case "$hosting" in
          ci-artifact) ;;
          static-site|none) echo "portal.hosting is $hosting: nothing is published in this version" ;;
        esac

    - name: Upload the export
      id: upload
      if: steps.portal.outputs.hosting == 'ci-artifact'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: arch-kit-export
        path: ${{ inputs.out }}
        if-no-files-found: error
