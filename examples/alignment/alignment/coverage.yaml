# The example's alignment record. Every name in it is invented, except the kit's own seed.
title: Sorrel against two references
status: draft
context: |
  How the lockers project compares with the references its owner named.

  - The first reference is compared in part: its roles only, and one element of our own.
  - The second is cited by title, because its terms are not confirmed.
