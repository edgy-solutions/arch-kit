# Declares the flow record example project to the export kit. Paths are relative to this file. Every name in it is invented.
kit: 1
paths:
  root: .
  repo: .
  decisions: decisions
name: Teasel
registers:
  follow_ups: FOLLOW-UPS.md
  debt: DEBT.md
  roadmap: ROADMAP.md      # there is no such file: a decisions-only portal has no roadmap page without one
portal:
  mode: decisions          # the decision records and their index; no capability record, views or model
  hosting: none
  audience: private        # private: every reference is shown in full
loader: kit_loader.py
decisions:
  records:
    file_prefix: false     # a record file is 0001-<slug>.md; its id is still ADR-0001
  index:
    register: FOLLOW-UPS.md
    readme: README.md
    register_homes: ["[0-9]*.md"]
    indexed: ["[0-9]*.md", FOLLOW-UPS.md]
    local_prefix: teasel
files:
  flows: flows.yaml        # the flow record: one YAML file whose only key is `flows`
export:
  browser:                 # what the browser check expects of the decisions-mode portal; nothing else is read
    search:
      phrase: cargo van    # two words that occur in one decision record's body only
      finds: ADR-0002      # that record: the search result for the phrase links its page
    min_pages: 5           # a floor for the printed PDF's page count: at least one page for each page of the portal
